<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Main Menu</title>
  

  <style>
    body {
      background: #000;
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .screen-wrapper {
        position: relative;
        width: 100vw;
        height: 56.25vw; 
        max-height: 100vh;
        max-width: 177.78vh; 
        overflow: hidden;
    }

    #bg-video {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 1; 
    }

    .content {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 2; 
    }

    .menu-btn {
        position: absolute; 
        font-size: 2.2vw; 
        font-weight: bold;
        background-color: transparent;
        color: rgba(255, 255, 255, 0);
        border: none;
        cursor: pointer;
        text-align: left;
        transition: color 0.3s ease, transform 0.2s ease;
        transform: rotate(-8deg);
    }

    .menu-btn:hover {
        background-color: rgba(255, 145, 0, 0.657);
        transform: scale(1.05);
        transform: rotate(-5deg);
    }

    #btn-continue {
        top: 44%;
        left: 24%;
    }

    #btn-campaign {
        top: 51%;
        left: 23%;
    }

    #btn-zombie {
        top: 58%;
        left: 24%;
    }

    #btn-options {
        top: 65%;
        left: 24%;
    }

    #btn-extras {
        top: 72%;
        left: 24%;
    }
  </style>
</head>
<body>
<script>
  const video = document.getElementById('bg-video');

  document.body.addEventListener('click', function() {
    if (video.paused) {
      video.play();
    }
  }, { once: true }); 
</script>

    <div class="screen-wrapper">
        <video autoplay loop id="bg-video">
            <source src="dyingmm.mp4" type="video/mp4">
        </video>

        <div class="content">
            <a href="https://info.lupey.dev" id="btn-continue" class="menu-btn">Contiijijijijjijijijnue</a>
            <button id="btn-campaign" class="menu-btn">Plahiuhbiij8hy Campaign</button>
            <button id="btn-zombie" class="menu-btn">Be the Zuhuhuhuombie</button>
            <button id="btn-options" class="menu-btn">Ohuhptions</button>
            <button id="btn-extras" class="menu-btn">Exhiuhtras</button>
        </div>
    </div>

</body>
</html>
